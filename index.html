<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barbería virtual</title>
<style>
:root{--bg:#eef0f1;--card:#fff;--ink:#16202a;--mute:#5d6a76;--line:#d5dbe0;--red:#c8372d;--blue:#1f4e79;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#10151a;--card:#1a222a;--ink:#eef2f5;--mute:#98a6b3;--line:#2c3743;--blue:#6fa8dc}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
.pole{height:10px;background:repeating-linear-gradient(135deg,var(--red) 0 12px,#fff 12px 24px,var(--blue) 24px 36px,#fff 36px 48px)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 2px;letter-spacing:-.01em}
p.sub{margin:0 0 14px;color:var(--mute)}
.stage{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:260px;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{max-width:100%;height:auto;display:none}
#empty{padding:32px 20px;text-align:center;color:var(--mute)}
#msg{min-height:1.4em;margin:8px 0;color:var(--mute);font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
button,label.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:8px;cursor:pointer}
button:focus-visible,label.btn:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.primary{background:var(--red);border-color:var(--red);color:#fff}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sw{width:36px;height:36px;border-radius:50%;padding:0;border:2px solid var(--line)}
.sw[aria-pressed=true]{border:3px solid var(--blue);box-shadow:0 0 0 2px var(--bg) inset}
.sl{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:8px;margin:6px 0}
h2{font-size:1rem;margin:16px 0 4px}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="pole"></div>
<main>
<h1>Barbería virtual</h1>
<p class="sub">Prueba cortes de cabello en tu foto. Todo se hace en tu dispositivo.</p>

<div class="stage">
  <div id="empty">Sube una foto de frente, con buena luz y la frente despejada.</div>
  <canvas id="cv"></canvas>
</div>
<div id="msg" role="status"></div>

<div class="row">
  <label class="btn primary" tabindex="0">Elegir foto<input id="f1" type="file" accept="image/*"></label>
  <label class="btn" tabindex="0">Tomar selfie<input id="f2" type="file" accept="image/*" capture="user"></label>
  <button id="save">Guardar imagen</button>
</div>

<h2>Corte</h2>
<div class="row" id="styles"></div>

<h2>Color</h2>
<div class="row" id="colors"></div>

<h2>Ajustes</h2>
<div class="sl"><span>Tamaño</span><input id="size" type="range" min="80" max="130" value="100"></div>
<div class="sl"><span>Altura</span><input id="dy" type="range" min="-10" max="15" value="0"></div>
<div class="sl"><span>Opacidad</span><input id="op" type="range" min="40" max="100" value="92"></div>
</main>

<script type="module">
import {FaceLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const STYLES = {
  buzz:    {n:"Rapado",     h:.20, q:0,   s:.50, a:.78, fade:true},
  fade:    {n:"Fade corto", h:.36, q:.04, s:.50, a:1,   fade:true},
  slick:   {n:"Peinado atrás", h:.46, q:.07, s:.47, a:1, fade:true},
  pompa:   {n:"Pompadour",  h:.52, q:.24, s:.50, a:1,   fade:true},
  curly:   {n:"Rizos arriba", h:.38, q:.04, s:.50, a:1, fade:true, bumps:true}
};
const COLORS = {Negro:"#15110f", Castaño:"#4a3020", Rubio:"#c9a45c", Pelirrojo:"#9a3f1c", Gris:"#9a9da1"};
let state = {style:"fade", color:"#15110f"}, bmp = null, lm = null, landmarker = null;

for (const [k,v] of Object.entries(STYLES)) {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = v.n; b.setAttribute("aria-pressed", k === state.style);
  b.onclick = () => { state.style = k; mark("styles", b); draw(); };
  b.dataset.k = k; $("styles").append(b);
}
for (const [n,c] of Object.entries(COLORS)) {
  const b = document.createElement("button");
  b.className = "sw"; b.style.background = c; b.title = n; b.setAttribute("aria-label", n);
  b.setAttribute("aria-pressed", c === state.color);
  b.onclick = () => { state.color = c; mark("colors", b); draw(); };
  $("colors").append(b);
}
function mark(id, el){ [...$(id).children].forEach(x => x.setAttribute("aria-pressed", x === el)); }
["size","dy","op"].forEach(i => $(i).oninput = draw);

async function getLandmarker(){
  if (landmarker) return landmarker;
  $("msg").textContent = "Cargando detector de rostro (solo la primera vez)…";
  const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  landmarker = await FaceLandmarker.createFromOptions(fs, {
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"},
    runningMode:"IMAGE", numFaces:1
  });
  return landmarker;
}

async function load(file){
  if (!file) return;
  try {
    bmp = await createImageBitmap(file, {imageOrientation:"from-image"});
    const sc = Math.min(1, 900 / bmp.width);
    cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
    cv.style.display = "block"; $("empty").style.display = "none";
    ctx.drawImage(bmp, 0, 0, cv.width, cv.height);
    const det = await getLandmarker();
    const res = det.detect(cv);
    lm = res.faceLandmarks && res.faceLandmarks[0] || null;
    $("msg").textContent = lm ? "Listo. Cambia de corte, color o ajusta el tamaño y la altura."
      : "No se detectó un rostro. Prueba con una foto de frente y con más luz.";
    draw();
  } catch (e) {
    $("msg").textContent = "No se pudo cargar el detector. Revisa tu conexión e inténtalo de nuevo.";
  }
}
$("f1").onchange = e => load(e.target.files[0]);
$("f2").onchange = e => load(e.target.files[0]);
document.querySelectorAll("label.btn").forEach(l => l.onkeydown = e => { if (e.key === "Enter") l.click(); });

function hairPath(st){
  const {h,q,s} = st, p = new Path2D();
  p.moveTo(-s, .34);
  p.bezierCurveTo(-s-.05, .05, -s*.8, -h, 0, -h-q);
  p.bezierCurveTo(s*.8, -h, s+.05, .05, s, .34);
  p.lineTo(s*.82, .12);
  p.bezierCurveTo(s*.6, .10, .3, .03, 0, .03);
  p.bezierCurveTo(-.3, .03, -s*.6, .10, -s*.82, .12);
  p.closePath();
  if (st.bumps) for (let a = .25; a < Math.PI - .2; a += .42) {
    const x = Math.cos(a) * s * .95, y = -Math.sin(a) * (h + q) * .95 + .05, r = .1;
    p.moveTo(x + r, y); p.arc(x, y, r, 0, Math.PI * 2);
  }
  return p;
}

function draw(){
  if (!bmp) return;
  ctx.drawImage(bmp, 0, 0, cv.width, cv.height);
  if (!lm) return;
  const P = i => ({x: lm[i].x * cv.width, y: lm[i].y * cv.height});
  const L = P(234), R = P(454), T = P(10);
  const W = Math.hypot(R.x - L.x, R.y - L.y);
  const roll = Math.atan2(R.y - L.y, R.x - L.x);
  const st = STYLES[state.style];
  const k = $("size").value / 100;
  ctx.save();
  ctx.translate(T.x, T.y + ($("dy").value / 100) * W);
  ctx.rotate(roll);
  ctx.scale(W * k, W * k);
  ctx.globalAlpha = st.a * ($("op").value / 100);
  ctx.fillStyle = state.color;

  if (st.fade) {          // costados degradados
    for (const m of [-1, 1]) {
      const g = ctx.createLinearGradient(0, .2, 0, .62);
      g.addColorStop(0, state.color); g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.save(); ctx.globalAlpha *= .55; ctx.fillStyle = g; ctx.beginPath();
      ctx.moveTo(m * st.s, .2); ctx.lineTo(m * (st.s - .01), .62);
      ctx.lineTo(m * (st.s - .1), .48); ctx.lineTo(m * (st.s - .08), .2);
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
  }
  const path = hairPath(st);
  ctx.fill(path);
  ctx.save(); ctx.clip(path);                // brillo y mechones
  const g = ctx.createLinearGradient(0, -st.h - st.q, 0, .1);
  g.addColorStop(0, "rgba(255,255,255,.22)"); g.addColorStop(1, "rgba(0,0,0,.18)");
  ctx.fillStyle = g; ctx.fillRect(-1, -1.2, 2, 1.5);
  ctx.strokeStyle = "rgba(0,0,0,.2)"; ctx.lineWidth = .006;
  for (let i = -7; i <= 7; i++) {
    ctx.beginPath(); ctx.moveTo(i * .05, .04);
    ctx.quadraticCurveTo(i * .07, -st.h * .5, i * .06 + (state.style === "slick" ? 0 : i * .01), -st.h - st.q * .8);
    ctx.stroke();
  }
  ctx.restore(); ctx.restore();
}

$("save").onclick = () => {
  if (!bmp) { $("msg").textContent = "Primero elige una foto."; return; }
  const a = document.createElement("a");
  a.download = "mi-corte.png"; a.href = cv.toDataURL("image/png"); a.click();
};
</script>
</body>
</html>
